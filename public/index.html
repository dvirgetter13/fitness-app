<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון תזונה ומעקב התקדמות</title>
    <meta name="description" content="מחשבון תזונה וכושר מתקדם לחישוב קלוריות, חלבון, פחמימות, שומנים ואחוזי שומן.">
    <meta name="keywords" content="מחשבון קלוריות, חלבון, אחוזי שומן, כושר, חיטוב, מסה">
    <meta name="google-site-verification" content="CdTSEsr_0VEq94tiPyKgSHscHHNJ-WX-eV8ZB1O4q8c" />
    
    <!-- PWA & Theme Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">

    <!-- Open Graph -->
    <meta property="og:title" content="מחשבון תזונה וכושר | Fitness App">
    <meta property="og:description" content="חשב בקלות קלוריות, ערכים תזונתיים ואחוזי שומן מוערכים.">
    <meta property="og:type" content="website">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --water: #0891b2;
            --water-hover: #0e7490;
            --bg-glass: rgba(255, 255, 255, 0.95);
            --bg-overlay: rgba(15, 23, 42, 0.65);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --success: #10b981;
            --success-hover: #34d399;
            --water: #06b6d4;
            --water-hover: #22d3ee;
            --bg-glass: rgba(15, 23, 42, 0.92);
            --bg-overlay: rgba(2, 6, 23, 0.88);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --card-bg: #0f172a;
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
            direction: rtl;
            color: var(--text-main);
            transition: background 0.3s ease, color 0.3s ease;
        }

        .main-wrapper {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-glass);
            padding: 12px 20px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border: 1px solid var(--border-color);
        }

        .theme-toggle-btn {
            background: var(--border-color);
            border: none;
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s;
        }

        .theme-toggle-btn:hover { transform: scale(1.05); }

        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            width: 100%;
            text-align: right;
        }

        .card-title {
            color: var(--text-main);
            margin: 0 0 16px 0;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .input-group { margin-bottom: 14px; text-align: right; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 13.5px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            text-align: right;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 700;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-success { background-color: var(--success); color: white; }
        .btn-success:hover { background-color: var(--success-hover); }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-water { background-color: var(--water); color: white; }
        .btn-water:hover { background-color: var(--water-hover); }

        .results-box {
            margin-top: 20px;
            padding: 18px;
            background: var(--card-bg);
            border-radius: 12px;
            border-right: 4px solid var(--primary);
            display: none;
            border: 1px solid var(--border-color);
        }

        .macro-list { list-style: none; padding: 0; margin: 12px 0 0 0; }
        .macro-list li {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }
        .macro-list li:last-child { border-bottom: none; }

        .meal-suggestion {
            margin-top: 15px;
            padding: 12px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border-radius: 8px;
            font-size: 13.5px;
            border-right: 3px solid var(--success);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 13px;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 8px;
            text-align: center;
            color: var(--text-main);
        }

        th { background-color: rgba(255,255,255,0.05); font-weight: 700; }

        .delete-btn {
            color: #ef4444;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 15px;
        }

        @media (max-width: 600px) {
            .card { padding: 20px; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="main-wrapper">

    <!-- סרגל עליון עם מתג מצב לילה -->
    <div class="top-bar">
        <span style="font-weight: bold; font-size: 1.1rem;">💪 Fitness App</span>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">
            🌙 מצב לילה
        </button>
    </div>

    <!-- מחשבון תזונה ראשי -->
    <div class="card">
        <h2 class="card-title">🥗 מחשבון תזונה מתקדם</h2>
        
        <div class="grid-2">
            <div class="input-group">
                <label>משקל (ק"ג):</label>
                <input type="number" id="weight" placeholder="למשל: 80">
            </div>
            <div class="input-group">
                <label>גובה (ס"מ):</label>
                <input type="number" id="height" placeholder="למשל: 180">
            </div>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label>היקף מותניים (ס"מ): <span style="font-size:11px; color:var(--text-muted);">(רשות)</span></label>
                <input type="number" id="waist" placeholder="למשל: 85">
            </div>
            <div class="input-group">
                <label>היקף צוואר (ס"מ): <span style="font-size:11px; color:var(--text-muted);">(רשות)</span></label>
                <input type="number" id="neck" placeholder="למשל: 38">
            </div>
        </div>

        <div class="input-group">
            <label>יעד תזונתי:</label>
            <select id="goal">
                <option value="muscle">בניית מסת שריר</option>
                <option value="fat_loss">חיטוב (ירידה באחוז שומן)</option>
                <option value="maintenance">שמירה על המשקל</option>
            </select>
        </div>

        <button class="btn btn-success" onclick="calculate()">חשב תפריט 🚀</button>

        <div class="results-box" id="resultsBox">
            <h3 style="margin-top:0;">תוצאות מומלצות:</h3>
            <p id="fatBox" style="display:none; color:var(--primary); font-weight: bold;">אחוז שומן מוערך: <span id="bodyFatRes"></span>%</p>
            <p style="font-size: 1.1rem;">קלוריות יומיות: <strong id="caloriesRes" style="color:var(--primary);"></strong> קק"ל</p>
            
            <ul class="macro-list">
                <li><span>חלבון יומי:</span> <strong id="proteinRes"></strong></li>
                <li><span>פחמימות יומיות:</span> <strong id="carbsRes"></strong></li>
                <li><span>שומנים יומיים:</span> <strong id="fatsRes"></strong></li>
            </ul>
            <div class="meal-suggestion" id="mealSuggestion"></div>
        </div>
    </div>

    <!-- מחשבונים נוספים ב-Grid -->
    <div class="grid-2">
        <div class="card" style="margin: 0;">
            <h2 class="card-title">🏋️‍♂️ מחשבון 1RM</h2>
            <div class="input-group">
                <label>משקל (ק"ג):</label>
                <input type="number" id="rmWeight" placeholder="למשל: 80">
            </div>
            <div class="input-group">
                <label>מספר חזרות:</label>
                <input type="number" id="rmReps" placeholder="למשל: 6">
            </div>
            <button class="btn btn-primary" onclick="calculate1RM()">חשב 1RM</button>
            <div id="rmResult" class="results-box"></div>
        </div>

        <div class="card" style="margin: 0;">
            <h2 class="card-title">💧 מחשבון מים יומי</h2>
            <div class="input-group">
                <label>משקל גוף (ק"ג):</label>
                <input type="number" id="waterWeight" placeholder="למשל: 75">
            </div>
            <div class="input-group">
                <label>דקות אימון ביום:</label>
                <input type="number" id="workoutMinutes" placeholder="למשל: 60" value="0">
            </div>
            <button class="btn btn-water" onclick="calculateWater()">חשב מים</button>
            <div id="waterResult" class="results-box" style="border-right-color: var(--water);"></div>
        </div>
    </div>

    <!-- גרף התקדמות -->
    <div class="card">
        <h3 class="card-title">📈 מגמת משקל וקלוריות</h3>
        <canvas id="progressChart"></canvas>
    </div>

    <!-- היסטוריה -->
    <div class="card">
        <h3 class="card-title">📜 היסטוריית חישובים</h3>
        <div class="input-group">
            <select id="filterGoal" onchange="loadHistory()">
                <option value="all">הצג הכל</option>
                <option value="muscle">בניית מסת שריר</option>
                <option value="fat_loss">חיטוב</option>
                <option value="maintenance">שמירה על המשקל</option>
            </select>
        </div>
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>משקל</th>
                        <th>% שומן</th>
                        <th>קלוריות</th>
                        <th>חלבון</th>
                        <th>מחק</th>
                    </tr>
                </thead>
                <tbody id="historyTable"></tbody>
            </table>
        </div>
        
        <button class="btn btn-primary" style="margin-top: 15px;" onclick="exportToCSV()">📥 הורד היסטוריה (CSV)</button>
    </div>

</div>

<script>
    // ניהול Dark Mode
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeBtn(newTheme);
    }

    function updateThemeBtn(theme) {
        const btn = document.getElementById('themeBtn');
        btn.innerHTML = theme === 'dark' ? '☀️ מצב יום' : '🌙 מצב לילה';
    }

    // טעינת העדפת נושא שמורה
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    window.addEventListener('DOMContentLoaded', () => updateThemeBtn(savedTheme));

    let progressChart = null;
    let currentHistoryData = [];

    function renderChart(data) {
        const ctx = document.getElementById('progressChart').getContext('2d');
        const labels = data.map((item, index) => `#${index + 1}`);
        const weights = data.map(item => item.weight);
        const calories = data.map(item => item.calories);

        if (progressChart) progressChart.destroy();

        progressChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'משקל (ק"ג)',
                        data: weights,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        yAxisID: 'yWeight',
                        tension: 0.3,
                        fill: true
                    },
                    {
                        label: 'קלוריות',
                        data: calories,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.1)',
                        yAxisID: 'yCalories',
                        tension: 0.3,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    yWeight: { type: 'linear', position: 'left', title: { display: true, text: 'ק"ג' } },
                    yCalories: { type: 'linear', position: 'right', title: { display: true, text: 'קק"ל' }, grid: { drawOnChartArea: false } }
                }
            }
        });
    }

    async function loadHistory() {
        try {
            const goalFilter = document.getElementById('filterGoal').value;
            const response = await fetch(`/api/history?goal=${goalFilter}`);
            const rows = await response.json();
            currentHistoryData = rows;
            
            const tbody = document.getElementById('historyTable');
            tbody.innerHTML = '';
            rows.forEach(r => {
                tbody.innerHTML += `<tr>
                    <td>${r.weight} ק"ג</td>
                    <td>${r.body_fat ? r.body_fat + '%' : '-'}</td>
                    <td>${r.calories}</td>
                    <td>${r.protein}ג'</td>
                    <td><button class="delete-btn" onclick="deleteItem(${r.id})">✖</button></td>
                </tr>`;
            });

            renderChart(rows);
        } catch (e) {
            console.error("שגיאה בטעינת היסטוריה:", e);
        }
    }

    async function deleteItem(id) {
        await fetch(`/api/history/${id}`, { method: 'DELETE' });
        loadHistory();
    }

    async function calculate() {
        const weight = document.getElementById('weight').value;
        const height = document.getElementById('height').value;
        const waist = document.getElementById('waist').value;
        const neck = document.getElementById('neck').value;
        const goal = document.getElementById('goal').value;

        const payload = { weight: Number(weight), height: Number(height), goal: goal };
        if (waist) payload.waist = Number(waist);
        if (neck) payload.neck = Number(neck);

        const response = await fetch('/api/calculate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) return alert(`שגיאה: ${data.error}`);

        if (data.bodyFatPercentage) {
            document.getElementById('bodyFatRes').innerText = data.bodyFatPercentage;
            document.getElementById('fatBox').style.display = 'block';
        } else {
            document.getElementById('fatBox').style.display = 'none';
        }

        document.getElementById('caloriesRes').innerText = data.recommendedCalories;
        document.getElementById('proteinRes').innerText = `${data.dailyProteinGrams} גרם`;
        document.getElementById('carbsRes').innerText = `${data.dailyCarbGrams} גרם`;
        document.getElementById('fatsRes').innerText = `${data.dailyFatGrams} גרם`;

        const proteinPerMeal = Math.round(data.dailyProteinGrams / 4);
        document.getElementById('mealSuggestion').innerText = `💡 מומלץ לחלק ל-4 ארוחות ביום: כ-${proteinPerMeal} גרם חלבון בכל ארוחה.`;
        document.getElementById('resultsBox').style.display = 'block';
        loadHistory();
    }

    function calculate1RM() {
        const weight = parseFloat(document.getElementById('rmWeight').value);
        const reps = parseInt(document.getElementById('rmReps').value);
        if (!weight || !reps || weight <= 0 || reps <= 0) return alert('אנא הזן נתונים תקינים');

        const oneRM = reps === 1 ? weight : Math.round(weight * (1 + reps / 30));
        const resultDiv = document.getElementById('rmResult');
        resultDiv.style.display = 'block';
        
        resultDiv.innerHTML = `
            <div><strong>1RM משוער: <span style="color: var(--primary);">${oneRM} ק"ג</span> 🔥</strong></div>
            <div style="font-size:0.85rem; margin-top:8px;">
                90% (3-5 חזרות): <strong>${Math.round(oneRM * 0.9)} ק"ג</strong><br>
                80% (8-10 חזרות): <strong>${Math.round(oneRM * 0.8)} ק"ג</strong><br>
                70% (12-15 חזרות): <strong>${Math.round(oneRM * 0.7)} ק"ג</strong>
            </div>
        `;
    }

    function calculateWater() {
        const weight = parseFloat(document.getElementById('waterWeight').value);
        const workoutMins = parseFloat(document.getElementById('workoutMinutes').value) || 0;
        if (!weight || weight <= 0) return alert('אנא הזן משקל תקין');

        const totalLiters = ((weight * 0.035) + ((workoutMins / 30) * 0.35)).toFixed(1);
        const totalGlasses = Math.round(totalLiters * 1000 / 250);

        const resultDiv = document.getElementById('waterResult');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
            <div><strong>צריכה מומלצת: <span style="color: var(--water);">${totalLiters} ליטר</span> 💧</strong></div>
            <div style="font-size:0.85rem; margin-top:4px;">כ-<strong>${totalGlasses} כוסות מים</strong> ביום.</div>
        `;
    }

    function exportToCSV() {
        if (!currentHistoryData.length) return alert('אין נתונים לייצוא');
        let csvContent = "\uFEFFמזהה,משקל (ק\"ג),גובה (ס\"מ),אחוז שומן (%),יעד,קלוריות,חלבון (גרם),תאריך\n";
        currentHistoryData.forEach(r => {
            csvContent += `${r.id},${r.weight},${r.height},${r.body_fat || ''},${r.goal},${r.calories},${r.protein},${r.created_at || ''}\n`;
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `history_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
    }

    loadHistory();
</script>

</body>
</html>
